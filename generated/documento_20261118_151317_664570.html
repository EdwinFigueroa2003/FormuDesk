
        <!DOCTYPE html>
        <html lang="es">
        <head>
            <meta charset="UTF-8">

            <title>Documento - DocuPrint</title>

            <style>
                body {
                    font-family: Arial, sans-serif;
                    margin: 40px;
                    color: #222;
                }

                .documento {
                    max-width: 750px;
                    margin: auto;
                    padding: 30px;
                    border: 1px solid #ddd;
                }

                h1 {
                    text-align: center;
                    margin-bottom: 40px;
                }

                .campo {
                    margin-bottom: 25px;
                }

                .campo strong {
                    display: block;
                    margin-bottom: 7px;
                }

                .descripcion {
                    white-space: pre-wrap;
                }

                @media print {
                    body {
                        margin: 0;
                    }

                    .documento {
                        border: none;
                    }
                }
            </style>
        </head>

        <body>

            <div class="documento">

                <h1>DOCUMENTO</h1>

                <div class="campo">
                    <strong>Nombre completo:</strong>
                    juan
                </div>

                <div class="campo">
                    <strong>Identificación:</strong>
                    45668213
                </div>

                <div class="campo">
                    <strong>Fecha:</strong>
                    18/11/2026
                </div>

                <div class="campo">
                    <strong>Descripción:</strong>
                    <div class="descripcion">WASAAA</div>
                </div>

            </div>

        </body>
        </html>
